name: Build desktop packages

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis
            artifact_name: openbis-upload-helper-windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe

          - name: Linux x64
            os: ubuntu-24.04
            bundles: appimage
            artifact_name: openbis-upload-helper-linux-x64
            artifact_path: src-tauri/target/release/bundle/appimage/*.AppImage

          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifact_name: openbis-upload-helper-macos
            artifact_path: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Build Python sidecar
        run: uv run python scripts/build_sidecar.py

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build desktop package
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14